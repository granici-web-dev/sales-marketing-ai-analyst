# Настройки pnpm для всего рабочего пространства.
#
# Здесь же — защита от подмены пакетов. Это не украшение: за последние годы
# npm пережил несколько червей, которые расходились через свежие версии
# популярных зависимостей и жили в реестре часы, пока их не снимали.
packages:
  - '.'

# Выдержка: пакет, опубликованный меньше недели назад, не ставится вовсе.
# Червь живёт в реестре часы, редко дни — неделя ожидания переживает его
# целиком. Плата за это настоящая и её видно: `next` пришлось взять 16.3.1
# вместо 16.3.3, потому что 16.3.3 вышел накануне. Уязвимость, ради которой
# поднимали, закрыта в обеих.
minimumReleaseAge: 10080

# Обновление пакета не вправе ослабить уже действующие настройки: иначе
# защиту снимает не человек, а очередная версия зависимости.
trustPolicy: no-downgrade

# Вложенные зависимости ставятся только из реестра. Ссылка на git или
# на архив по адресу внутри чужого пакета — это установка кода, которого
# нет в реестре и который никто не проверял.
blockExoticSubdeps: true

# Сборочные скрипты выполняются только у перечисленных. В pnpm 10 список
# живёт здесь, а не в package.json: там он остался бы молча непрочитанным.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - sharp
  - unrs-resolver
