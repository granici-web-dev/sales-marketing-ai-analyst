[project]
name = "sales-analyst-backend"
version = "0.1.0"
description = "Sales & Marketing AI Analyst backend"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio==1.2.0",
    "pytest-cov",
    "httpx",
    "factory-boy",
    "freezegun",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "COM", "C4", "PT", "RET", "SIM", "TID"]
ignore = ["COM812", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
