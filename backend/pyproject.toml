[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-analyst-backend"
version = "0.1.0"
description = "Sales & Marketing AI Analyst backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1",
    # Transitive through fastapi, which asks only for >=0.46 and would
    # happily install 1.0.1 again. Pinned directly because that version
    # rebuilds request.url from an unvalidated path (PYSEC-2026-248) and
    # ignores the form-parsing limits for urlencoded bodies
    # (PYSEC-2026-249). Both are on the request path of every endpoint.
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyjwt>=2.8,<3",
    "bcrypt>=4.0",
    "structlog>=24,<26",
    "celery[redis]>=5.4,<6",
    "celery-redbeat>=2.2,<3",
    # Потолок ставит не этот файл, а kombu: у него `redis<6.5`. Стояло `<6`,
    # тогда как в рабочем окружении оказалась 7.4.0 — версия, которую этот
    # проект законно установить не может, и именно на ней мерялась чистота
    # типов. Здесь записано то, что действительно ставится.
    "redis>=5,<6.5",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "anthropic>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Стояло `<1`, при том что разработка идёт на 1.2.0. Из-за расхождения
    # CI ставил 0.26 и вскрывал тест, который сливал чужие задачи из общего
    # множества `_pending`.
    "pytest-asyncio>=0.26,<2",
    "pytest-cov",
    "httpx",
    "factory-boy",
    "freezegun",
    "respx>=0.21,<1",
    # Dependency audit. The frontend had 17 production advisories when it was
    # first checked; the backend had never been checked at all.
    "pip-audit",
    # Configured in this file since the start and never declared as a dependency,
    # so CI would have had nothing to run.
    "ruff>=0.15,<1",
    # Same story: `strict = true` was configured and mypy was absent.
    "mypy>=2.3,<3",
]

# Без этого setuptools видит в каталоге два корня — `app` и `alembic` — и
# отказывается выбирать за нас: «Multiple top-level packages discovered in a
# flat-layout». Устанавливается только `app`; `alembic` — это миграции, их
# запускают из каталога, а не импортируют как пакет.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "S", "B", "A", "COM", "C4", "PT", "RET", "SIM", "TID",
    # The broad-catch discipline was a convention enforced by 28 `# noqa: BLE001`
    # markers against a rule that was never switched on. Now it is.
    "BLE",
    "PLC",
    # Fails on a `# noqa` that suppresses nothing. This is what keeps the marker
    # count honest: a suppression outliving its rule becomes an error, not decor.
    "RUF100",
]
ignore = [
    "COM812",
    # Tests assert.
    "S101",
    # `Depends()` and `Query()` in a default argument is the FastAPI idiom, not a
    # shared-mutable-default defect. 38 occurrences, all of them the framework.
    "B008",
    # Deferred imports are required here, not tolerated: INFRA-05 keeps app imports
    # out of module scope so a Celery fork does not inherit a parent's connections.
    # 442 of them are deliberate. The rule asks for the opposite of the design, so
    # it is off by name — and the discipline is guarded by a test that asserts
    # `app.db.session` is absent from `celery_app`'s module scope, which is the
    # thing that actually breaks.
    "PLC0415",
    # Function-local constants are spelled as constants here (`_GROUP_COLUMNS`,
    # `PERCENT_FIELDS`). 31 of them, deliberate and readable.
    "N806",
    # `ruff format` owns line length for code and is checked in CI. What E501
    # still catches after formatting is literal content: 28 lines of Romanian
    # prompt text, SQL, docstrings, seed data. Reflowing a prompt to fit a column
    # limit risks changing the prompt, which is a worse trade than a long line.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Test code is not deployed. `exec`, a partial executable path and a subprocess
# call are how these tests inspect migrations and worker start-up; none of them
# is reachable by a request.
"tests/**" = ["S102", "S105", "S603", "S607", "SIM102", "SIM117", "PT018", "PT028"]
# Migrations carry seed data, including a password *hash*, which is not a secret
# in the sense S105 means.
"alembic/versions/**" = ["S105"]
# Two chat tools build a `text()` query with an interpolated identifier. In
# get_leads it is one of two literal table names chosen by an if/else; in
# get_loss_reasons it is a value from a static dict whose KeyError fails closed
# (CR-06). Every *value* in both queries is a bound parameter. Ruff anchors this
# diagnostic inside an implicit string concatenation where a `# noqa` cannot be
# placed, so the exemption is recorded here — narrowed to these two files, and
# it lapses the moment either one is renamed.
"app/services/chat/tools/get_leads.py" = ["S608"]
"app/services/chat/tools/get_loss_reasons.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# Checked over `app` only. The test suite is not held to strict typing; the
# application it exercises is.
files = ["app"]

# `strict = true` was declared here from the first commit and mypy was never
# installed, so nothing checked the claim. First run: 212 errors across 56 of
# 111 modules. They are now zero — the declaration is true. What follows is the
# one blanket relaxation, plus the two library gaps that force it.

# 138 of those 212 were bare `dict` / `list` annotations. That is a breadth of
# annotation debt, not a correctness problem, and turning it on today would make
# the gate red on arrival for no defect found. Left off deliberately, to be
# turned on once the annotations are filled in.
disallow_any_generics = false

# celery and redbeat ship no type information, so `@celery_app.task` is an
# untyped decorator and, under strict, every task it wraps becomes untyped too.
[[tool.mypy.overrides]]
module = ["celery.*", "redbeat.*", "celery_redbeat.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.tasks.*"
disallow_untyped_decorators = false
