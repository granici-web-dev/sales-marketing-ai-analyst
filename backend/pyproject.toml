[project]
name = "sales-analyst-backend"
version = "0.1.0"
description = "Sales & Marketing AI Analyst backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyjwt>=2.8,<3",
    "bcrypt>=4.0",
    "structlog>=24,<26",
    "celery[redis]>=5.4,<6",
    "celery-redbeat>=2.2,<3",
    "redis>=5,<6",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "anthropic>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio>=0.21,<1",
    "pytest-cov",
    "httpx",
    "factory-boy",
    "freezegun",
    "respx>=0.21,<1",
    # Dependency audit. The frontend had 17 production advisories when it was
    # first checked; the backend had never been checked at all.
    "pip-audit",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "COM", "C4", "PT", "RET", "SIM", "TID"]
ignore = ["COM812", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
