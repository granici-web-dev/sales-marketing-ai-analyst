# A generic, single database configuration for Alembic.
# The actual DATABASE_URL is injected at runtime via env.py using
# os.environ["DATABASE_URL"] — no credentials are stored in this file (T-04-04 mitigation).

[alembic]
# Path to the Alembic scripts directory (relative to this file)
script_location = alembic

# Prepend backend/ to sys.path so `from app.` imports work in env.py
prepend_sys_path = .

# Location of migration version files
version_locations = %(here)s/alembic/versions

# Placeholder — overridden at runtime by env.py reading DATABASE_URL env var.
# Never set a real database URL here — it would be committed to version control.
sqlalchemy.url = driver://user:pass@localhost/dbname


# Logging configuration.
# See: https://docs.python.org/3/library/logging.config.html#configuration-file-format

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
