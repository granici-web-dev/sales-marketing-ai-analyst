# Разрешённый набор зависимостей: то, на чём проверено.
#
# У фронтенда `pnpm-lock.yaml` появился ровно по этой причине, и она же
# подтвердилась здесь на первом же прогоне CI. Диапазоны в pyproject.toml
# описывают, что *допустимо*; этот файл описывает, что *проверено*. Без него
# рабочее окружение и сервер расходятся молча: у разработчика оказались
# redis 7.4.0 и pytest-asyncio 1.2.0 при объявленных `<6` и `<1`, а сервер
# ставил 5.3.1 и 0.26.0 — и вскрывал тест, который на 1.x не падал.
#
# Пересобрать после правки зависимостей:
#
#   python3.11 -m venv /tmp/lock && /tmp/lock/bin/pip install -e ".[dev]"
#   /tmp/lock/bin/pip freeze --exclude-editable > requirements.lock
#
# Собирать надо в чистом окружении: freeze из рабочего запишет и то, что
# туда попало помимо объявленного.
