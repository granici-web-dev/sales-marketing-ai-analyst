# Проверки, которые до этого запускались только руками.
#
# Каждый шаг ниже уже был зелёным на машине разработчика в момент заведения:
# ruff 0 находок, ruff format без расхождений, mypy 0 ошибок, 572 теста с базой
# и 73 на фронтенде. Гейт заводится зелёным — иначе его первым же делом
# научатся не читать.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый толчок в ту же ветку отменяет предыдущий прогон: смысл имеет последний.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд — линтер, формат, типы, тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analyst
          POSTGRES_PASSWORD: analyst
          POSTGRES_DB: analyst_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analyst -d analyst_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://analyst:analyst@localhost:5432/analyst_test
      # Отдельное имя, потому что наличие DATABASE_URL говорит лишь о том, что
      # приложение настроено, а не о том, что рядом стоит одноразовая база.
      TEST_DATABASE_URL: postgresql+asyncpg://analyst:analyst@localhost:5432/analyst_test
      REDIS_URL: redis://localhost:6379/0
      # Значения-заглушки: обращения к обеим службам в тестах подменяются,
      # существовать они обязаны лишь для того, чтобы Settings собрался.
      MEFI_API_KEY: test-key
      ANTHROPIC_API_KEY: test-key

    defaults:
      run:
        working-directory: backend

    steps:
      # Закреплено по хешу, а не по метке: метку `v5` владелец действия
      # может передвинуть на любой коммит, и наш CI выполнит его без
      # единой правки у нас. Обновлять — вместе с новой проверкой.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Установить зависимости
        # Из замка́, а не из диапазонов: диапазоны говорят, что допустимо,
        # замо́к — что проверено. Первый прогон этого гейта поставил redis 5.3.1
        # и pytest-asyncio 0.26 там, где на машине разработчика стояли 7.4.0
        # и 1.2.0, и упал на том, что локально никогда не падало.
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Линтер
        run: ruff check .

      - name: Формат
        run: ruff format --check .

      - name: Типы
        run: mypy

      - name: Миграции
        run: alembic upgrade head

      - name: Тесты
        # Без базы 39 из них пропускаются. Здесь база есть, поэтому пропусков
        # быть не должно ни одного, кроме трёх помеченных явно.
        run: pytest -q

  frontend:
    name: Фронтенд — линтер, типы, тесты, сборка
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Без `version:` намеренно: действие берёт версию из поля
        # packageManager в frontend/package.json. Записанная здесь числом,
        # она разъезжалась с образом и с машиной разработчика — так это
        # и случилось с девяткой.
        with:
          # Путь от корня репозитория, а не от frontend. `defaults.run.
          # working-directory` действует только на шаги `run:`, на входы
          # действия — нет: без этой строки действие ищет package.json
          # в корне и падает «No pnpm version is specified». Соседний
          # cache-dependency-path у setup-node написан от корня по той же
          # причине.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Установить зависимости
        # --frozen-lockfile: расхождение lock-файла с package.json должно
        # останавливать прогон, а не молча разрешаться.
        run: pnpm install --frozen-lockfile

      - name: Линтер
        run: pnpm lint

      - name: Тесты
        run: pnpm vitest run

      - name: Сборка
        run: pnpm build

      - name: Типы
        # После сборки, а не до неё. `next-env.d.ts` не хранится в репозитории
        # и ссылается на `.next/types/`: объявления для импортов изображений и
        # типизированных маршрутов Next создаёт во время сборки. Сегодня здесь
        # ни того ни другого нет и порядок безразличен — но первый же импорт
        # картинки уронил бы прогон по причине, к правке не относящейся.
        run: pnpm typecheck

      - name: Браузер — установить chromium
        # Только он: прогон проверяет дописывание ответа в пузырь, а не
        # разницу движков. Три браузера стоили бы втрое дольше на каждый push
        # ради того же утверждения.
        run: pnpm exec playwright install --with-deps chromium

      - name: Чат в настоящем браузере
        # Единственная проверка, которой недостаточно jsdom: тот не умеет
        # потокового чтения тела ответа, а ответ бота приходит по SSE
        # и дописывается кусочками. Движок и бэкенд подменены — проверяется
        # отрисовка, а не установка целиком.
        run: pnpm test:e2e

      - name: Защита маршрутов — запросом к собранному приложению
        # Проверки в src/__tests__ зовут proxy() напрямую и доказывают, что
        # функция рассуждает верно. Что Next её вызывает — доказывает только
        # запрос: файл уже лежал не там, где Next его ищет, и весь кабинет
        # отдавался без сессии при полностью правильной функции.
        run: pnpm test:routes
